<!-- Foreman's icon, drawn on an 824-unit tile: a three-lane board in the board's kind
     colours (agent teal, joint purple, human amber) with one card lifted out of its lane,
     the one thing being moved. render-icon.mjs frames it for macOS and Windows. -->
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#26303d"/>
    <stop offset="1" stop-color="#10151b"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="lift" x="-60%" y="-80%" width="220%" height="280%">
    <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f0993a" flood-opacity="0.55"/>
  </filter>
  <g id="lines">
    <rect x="44" y="26" width="104" height="13" rx="6.5" fill="#9aa5b4"/>
    <rect x="44" y="52" width="68" height="13" rx="6.5" fill="#c3cad4"/>
  </g>
</defs>
<rect width="824" height="824" rx="185" fill="url(#tile)"/>
<rect width="824" height="824" rx="185" fill="url(#sheen)"/>
<rect x="1.5" y="1.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

<!-- Lanes -->
<rect x="55" y="118" width="210" height="588" rx="38" fill="#ffffff" fill-opacity="0.06"/>
<rect x="307" y="118" width="210" height="588" rx="38" fill="#ffffff" fill-opacity="0.06"/>
<rect x="559" y="118" width="210" height="588" rx="38" fill="#ffffff" fill-opacity="0.06"/>

<!-- Lane 1 -->
<g transform="translate(71 136)"><rect width="178" height="92" rx="20" fill="#37b3c9"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>
<g transform="translate(71 244)"><rect width="178" height="92" rx="20" fill="#a07ff2"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>
<g transform="translate(71 352)"><rect width="178" height="92" rx="20" fill="#37b3c9"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>
<g transform="translate(71 460)"><rect width="178" height="92" rx="20" fill="#37b3c9"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>

<!-- Lane 2: the lifted card's empty slot -->
<g transform="translate(323 136)"><rect width="178" height="92" rx="20" fill="#a07ff2"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>
<rect x="325" y="246" width="174" height="88" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4" stroke-dasharray="14 11"/>
<g transform="translate(323 352)"><rect width="178" height="92" rx="20" fill="#37b3c9"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>

<!-- Lane 3 -->
<g transform="translate(575 136)"><rect width="178" height="92" rx="20" fill="#37b3c9"/><rect x="20" width="158" height="92" rx="20" fill="#eef1f5"/><use href="#lines"/></g>

<!-- The lifted card -->
<g transform="translate(548 282) rotate(-8) scale(1.24) translate(-89 -46)" filter="url(#lift)">
  <rect width="178" height="92" rx="20" fill="#f0993a"/>
  <rect x="20" width="158" height="92" rx="20" fill="#ffffff"/>
  <use href="#lines"/>
</g>
