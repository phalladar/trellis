<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trellis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='4' height='12' rx='1' fill='%231f8a9e'/%3E%3Crect x='6' y='2' width='4' height='8' rx='1' fill='%23d97b12'/%3E%3Crect x='11' y='2' width='4' height='10' rx='1' fill='%237a4fd1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="board-picker">
      <button type="button" id="board-button" class="board-trigger ghost" aria-haspopup="dialog" aria-expanded="false" aria-controls="board-menu" title="Switch or manage board directories">
        <span id="board-name" class="board-title">Trellis</span>
        <span id="board-path" class="board-path"></span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <section id="board-menu" class="board-menu" role="dialog" aria-label="Boards" hidden></section>
    </div>
    <input id="search" type="search" placeholder="Search title and body…" autocomplete="off">
    <div class="segmented" id="kind-filter" role="group" aria-label="Filter by kind">
      <button type="button" data-kind="" class="on">All</button>
      <button type="button" data-kind="agent" class="kind-agent"></button>
      <button type="button" data-kind="human" class="kind-human"></button>
      <button type="button" data-kind="joint" class="kind-joint"></button>
    </div>
    <select id="label-filter" aria-label="Filter by label"><option value="">Any label</option></select>
    <label class="toggle"><input type="checkbox" id="show-done"> Done</label>
    <label class="toggle"><input type="checkbox" id="show-archived"> Archived</label>
    <label class="toggle"><input type="checkbox" id="show-blocked"> Blocked only</label>
    <button type="button" id="add-list" class="ghost">+ List</button>
    <span id="status" class="status" aria-live="polite"></span>
    <div class="jewel">
      <button type="button" id="info-button" class="ghost info-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="info-modal" aria-label="About Trellis" title="About Trellis">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9v5m0-7.5v.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="activity-button" class="ghost bell" aria-haspopup="dialog" aria-expanded="false" aria-controls="activity" aria-label="Activity" title="Activity">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2a5.3 5.3 0 0 0-5.3 5.3v2.9L3.2 13.2a.9.9 0 0 0 .8 1.3h12a.9.9 0 0 0 .8-1.3l-1.5-2.8V7.5A5.3 5.3 0 0 0 10 2.2Z"/><path d="M7.6 15.6a2.5 2.5 0 0 0 4.8 0Z"/></svg>
        <span id="activity-badge" class="badge" hidden></span>
      </button>
      <section id="activity" class="activity" role="dialog" aria-label="Activity" hidden></section>
      <section id="info-modal" class="info-modal" role="dialog" aria-label="About Trellis" hidden></section>
    </div>
  </header>
  <div class="legend" id="legend"></div>
  <main id="lanes" class="lanes" aria-label="Lists"></main>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="panel" class="panel" hidden aria-label="Card"></aside>
  <script type="module" src="/app.js"></script>
</body>
</html>
